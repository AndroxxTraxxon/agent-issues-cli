[package]
name = "issues"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "CLI for managing agent issues in a local SQLite store"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
